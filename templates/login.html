{% extends 'base.html' %}
{% block content %}
<div class="col-md-6">
    <form action="" method="POST" class="shadow p-3">
        <h2 class="text-center">Login</h2>
        <div class="mb-3">
            <input type="text" name="username" id="" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" id="" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <p class="mt-3">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </form>
</div>
{% endblock %}
